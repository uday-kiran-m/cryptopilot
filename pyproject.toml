[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopilot"
version = "0.1.0"
description = "Explainable multi-agentic AI crypto trading system"
authors = [{name = "CryptoPilot Team"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["crypto", "trading", "ai", "agents", "crewai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.15.0",
    "python-binance>=1.0.19",
    "coinbase-advanced-py>=1.2.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "talipp>=0.8.0",
    "ta>=0.11.0",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "loguru>=0.7.0",
    "langchain-ollama>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
cryptopilot = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "A", "RUF"]
ignore = ["D100", "D104", "D203", "D213", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
